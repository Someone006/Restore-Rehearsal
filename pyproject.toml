[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "restore-rehearsal"
version = "0.3.0"
description = "Local project evidence, inspection, and isolated restore rehearsals for people and AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Rehearse contributors" }]
license-files = ["LICENSE"]
keywords = [
  "agent-skills",
  "ai-agents",
  "backup",
  "backup-validation",
  "code-analysis",
  "dependency-graph",
  "disaster-recovery",
  "docker-compose",
  "knowledge-graph",
  "mcp-server",
  "project-brain",
  "restore",
  "restore-testing",
  "self-hosted",
  "software-architecture",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: System :: Systems Administration",
]
dependencies = ["pathspec>=0.12,<1", "PyYAML>=6.0.2,<7"]

[project.urls]
Homepage = "https://someone006.github.io/Restore-Rehearsal/"
Documentation = "https://someone006.github.io/Restore-Rehearsal/project-brain/"
Issues = "https://github.com/Someone006/Restore-Rehearsal/issues"
Source = "https://github.com/Someone006/Restore-Rehearsal"

[project.optional-dependencies]
dev = [
  "build>=1.2.2,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
rehearse = "restore_rehearsal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/restore_rehearsal"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = ["docker: requires a local Docker daemon and preloaded images"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/restore_rehearsal/brain/review.py" = ["E501"]
"src/restore_rehearsal/brain/schema.py" = ["E501"]
"src/restore_rehearsal/brain/visual.py" = ["E501"]
