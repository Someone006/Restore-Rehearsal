[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "restore-rehearsal"
version = "0.2.0"
description = "Rehearse restores and upgrades, with a local one-file project evidence brain"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Rehearse contributors" }]
keywords = [
  "ai-agents",
  "backup",
  "code-analysis",
  "dependency-graph",
  "disaster-recovery",
  "docker-compose",
  "restore",
  "self-hosted",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: System :: Systems Administration",
]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = [
  "build>=1.2.2,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
rehearse = "restore_rehearsal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/restore_rehearsal"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["docker: requires a local Docker daemon and preloaded images"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/restore_rehearsal/brain/review.py" = ["E501"]
"src/restore_rehearsal/brain/schema.py" = ["E501"]
"src/restore_rehearsal/brain/visual.py" = ["E501"]
